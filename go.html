<body>
<div class="c">
  <div style="margin-bottom:18px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <h1>Открываем Telegram</h1>
  <p>Если ничего не произошло, нажмите кнопку.</p>
  <a class="btn" id="go" href="https://t.me/firevadim">Перейти в канал</a>
</div>
<script>
(function () {
  var YM_ID = 112271125;
  var TARGET = "https://t.me/firevadim";

  // откуда пришёл человек: ?from=dzen, ?from=reels и т.д.
  var from = (new URLSearchParams(location.search).get("from") || "direct")
               .toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24) || "direct";

  document.getElementById("go").href = TARGET;

  var jumped = false;
  function jump() {
    if (jumped) return;
    jumped = true;
    location.replace(TARGET);
  }

  // цель общая + отдельная по источнику, чтобы в Метрике было видно разбиение
  try {
    if (typeof ym === "function") {
      ym(YM_ID, "reachGoal", "go_tg", { from: from });
      ym(YM_ID, "reachGoal", "go_tg_" + from, {}, jump);
    }
  } catch (e) {}

  // страховочный пиксель, если tag.js не догрузился (блокировщик, старый вебвью)
  setTimeout(function () {
    var loaded = false;
    try { loaded = (typeof ym === "function") && !ym.a; } catch (e) {}
    if (!loaded) {
      try {
        var i = new Image();
        i.src = "https://mc.yandex.ru/watch/" + YM_ID +
                "?rn=" + Math.floor(Math.random() * 1e6) +
                "&page-url=" + encodeURIComponent(location.href) +
                "&fallback=go_" + from;
      } catch (e) {}
    }
  }, 1200);

  // уходим в любом случае: колбэк Метрики мог не прийти
  setTimeout(jump, 1400);
})();
</script>
