<style>
  :root{
    /* фирменные цвета Вадима: тёмный #121212 + золото #C9A227.
       нейтральные уведены в тёплую сторону, к акценту, а не в чистый серый */
    --bg:#121212; --surface:#1A1A17; --surface2:#221F1A;
    --line:#2E2A22; --text:#F2F0EA; --muted:#9A948A;
    --gold:#C9A227; --green:#3FB950; --red:#E5484D;
    --display:"Unbounded","Golos Text",system-ui,sans-serif;
    --body:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:var(--body);line-height:1.45;overflow-x:hidden;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}

  /* ---------- главный экран ---------- */
  .head{padding:8px 0 20px}
  .head h1{margin:0 0 6px;font-family:var(--display);font-size:23px;font-weight:800;
    letter-spacing:-.02em;text-wrap:balance;line-height:1.2}
  .head p{margin:0;color:var(--muted);font-size:14px}
  .progress{margin:16px 0 22px}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
  .progress span{display:block;margin-top:8px;font-size:12px;color:var(--muted)}

  .menu{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;
    transition:border-color .2s,transform .08s}
  .item:active{transform:scale(.985)}
  .item.done{border-color:rgba(201,162,39,.45)}
  .item .num{font-family:var(--display);font-size:11px;font-weight:600;color:var(--gold);
    letter-spacing:.06em;min-width:24px}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:16px;font-weight:700}
  .item .txt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .item .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:11px;color:var(--bg);flex:none}
  .item.done .tick{background:var(--gold);border-color:var(--gold)}
  .item.done .tick::after{content:"✓";font-weight:800}

  .legal{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    color:#6e6e6e;font-size:11px;line-height:1.5}
  .policy-link{color:#8a8378;text-decoration:underline}

  /* ---------- экран раздела ---------- */
  .screen{display:none}
  .screen.on{display:block}
  .topbar{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
  .back{background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
  .topbar h2{margin:0;font-size:17px;font-weight:700}

  /* карточки */
  .deck{position:relative}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:26px 22px;min-height:300px;display:flex;flex-direction:column;justify-content:center}
  .card .big{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em;
    margin:0 0 14px;text-wrap:balance;line-height:1.32}
  .card .small{font-size:15px;color:var(--muted);margin:0}
  .dots{display:flex;gap:6px;justify-content:center;margin:16px 0 14px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--gold);width:18px;border-radius:3px}
  .nav{display:flex;gap:10px}
  .nav button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
  .nav button.primary{background:var(--gold);border-color:var(--gold);color:#1a1500}
  .nav button:disabled{opacity:.35}

  /* словарь */
  .term{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:10px}
  .term b{display:block;color:var(--gold);font-size:15px;margin-bottom:5px}
  .term p{margin:0;font-size:14px;color:#cfcfcf}

  /* калькулятор */

  .field{margin-bottom:18px}
  .field .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .field label{font-size:14px;color:#d5d5d5}
  .field .val{font-size:15px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;
    background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    border-radius:50%;background:var(--gold);cursor:pointer;border:3px solid var(--bg)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:var(--gold);cursor:pointer;border:3px solid var(--bg)}

  .result{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-top:22px}
  .gross{font-size:13px;color:var(--muted);margin:0 0 4px}
  .gross-v{font-family:var(--display);font-size:29px;font-weight:800;color:var(--green);
    margin:0 0 16px;font-variant-numeric:tabular-nums}
  .costs{border-top:1px solid var(--line);padding-top:14px}
  .cost{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:#c4c4c4}
  .cost span:last-child{color:var(--red);font-variant-numeric:tabular-nums}
  .total{border-top:1px solid var(--line);margin-top:12px;padding-top:14px;
    display:flex;justify-content:space-between;align-items:baseline}
  .total span{font-size:14px;color:var(--muted)}
  .total b{font-family:var(--display);font-size:27px;font-weight:800;
    font-variant-numeric:tabular-nums}
  .verdict{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface2);
    font-size:14px;line-height:1.5}
  .note{color:#6e6e6e;font-size:12px;margin-top:16px;line-height:1.5}

  /* оффер */
  .block{background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:20px;margin-bottom:14px}
  .block.paid{border-color:rgba(201,162,39,.45)}
  .block h3{margin:0 0 14px;font-size:16px;font-weight:700}
  .block.paid h3{color:var(--gold)}
  .block ul{margin:0;padding-left:18px}
  .block li{font-size:14px;color:#cfcfcf;margin-bottom:9px}
  .block .free-text{margin:0;font-size:15px;color:#cfcfcf;line-height:1.5}
  .cta{display:block;width:100%;padding:17px;border-radius:14px;background:var(--gold);
    color:#1a1500;font-size:16px;font-weight:800;text-align:center;text-decoration:none;
    border:none;cursor:pointer;margin-top:6px}
  .honest{color:var(--muted);font-size:13px;margin-top:14px;text-align:center;line-height:1.5}

  .stub{text-align:center;padding:60px 20px;color:var(--muted)}

  button:focus-visible,a:focus-visible,input:focus-visible,.item:focus-visible{
    outline:2px solid var(--gold);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

которая требует времени, дисциплины и внимания."}]};

var DATA = null, DONE = {};
try { DONE = JSON.parse(localStorage.getItem('arb_done') || '{}'); } catch (e) { DONE = {}; }
function saveDone(){ try { localStorage.setItem('arb_done', JSON.stringify(DONE)); } catch(e){} }

var home = document.getElementById('home'), detail = document.getElementById('detail');

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function money(n){ return Math.round(n).toLocaleString('ru-RU') + ' ₽'; }

/* ---------- главный экран ---------- */
function renderHome(){
  var s = DATA.sections, total = s.length, done = s.filter(function(x){return DONE[x.id];}).length;
  home.innerHTML =
    '<div class="head"><h1>' + esc(DATA.app.title) + '</h1><p>' + esc(DATA.app.subtitle) + '</p></div>' +
    '<div class="progress"><div class="bar"><i style="width:' + (done/total*100) + '%"></i></div>' +
    '<span>Пройдено ' + done + ' из ' + total + '</span></div>' +
    '<div class="menu">' + s.map(function(sec){
      return '<div class="item' + (DONE[sec.id] ? ' done' : '') + '" tabindex="0" role="button" data-id="' + sec.id + '">' +
        '<div class="num">' + esc(sec.num) + '</div>' +
        '<div class="txt"><b>' + esc(sec.title) + '</b><small>' + esc(sec.hint) + '</small></div>' +
        '<div class="tick"></div></div>';
    }).join('') + '</div>' +
    '<div class="legal">' + esc(DATA.app.disclaimer) +
      '<br><br>Приложение использует файлы cookie для анонимной статистики. ' +
      '<a href="policy.html" class="policy-link">Политика обработки данных</a></div>';

  home.querySelectorAll('.item').forEach(function(el){
    el.onclick = function(){ openSection(el.dataset.id); };
    el.onkeydown = function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openSection(el.dataset.id); }
    };
  });
}

function show(which){
  home.classList.toggle('on', which === 'home');
  detail.classList.toggle('on', which === 'detail');
  window.scrollTo(0, 0);
}

function markDone(id){ DONE[id] = true; saveDone(); goal('done_' + id); }

function topbar(sec){
  return '<div class="topbar"><button class="back" id="back">←</button><h2>' +
    esc(sec.title) + '</h2></div>';
}
function bindBack(){
  var b = document.getElementById('back');
  if (b) b.onclick = function(){ renderHome(); show('home'); };
}

/* ---------- раздел ---------- */
function openSection(id){
  var sec = DATA.sections.filter(function(x){ return x.id === id; })[0];
  if (!sec) return;
  goal('open_' + id);
  if (sec.type === 'cards')      renderCards(sec);
  if (sec.type === 'glossary')   renderGlossary(sec);
  if (sec.type === 'calculator') renderCalc(sec);
  if (sec.type === 'offer')      renderOffer(sec);
  show('detail');
}

/* карточки со свайпом */
function renderCards(sec){
  var i = 0;
  function draw(){
    var c = sec.cards[i];
    detail.innerHTML = topbar(sec) +
      '<div class="deck"><div class="card" id="card">' +
        '<p class="big">' + esc(c.big) + '</p>' +
        '<p class="small">' + esc(c.small) + '</p></div>' +
      '<div class="dots">' + sec.cards.map(function(_, k){
        return '<i class="' + (k === i ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
      '<div class="nav">' +
        '<button id="prev"' + (i === 0 ? ' disabled' : '') + '>Назад</button>' +
        '<button id="next" class="primary">' +
          (i === sec.cards.length - 1 ? 'Готово' : 'Дальше') + '</button>' +
      '</div></div>';
    bindBack();
    document.getElementById('prev').onclick = function(){ if (i > 0){ i--; draw(); } };
    document.getElementById('next').onclick = function(){
      if (i < sec.cards.length - 1){ i++; draw(); }
      else { markDone(sec.id); renderHome(); show('home'); }
    };
    var card = document.getElementById('card'), x0 = null;
    card.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
    card.addEventListener('touchend', function(e){
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (dx < -45 && i < sec.cards.length - 1){ i++; draw(); }
      if (dx > 45 && i > 0){ i--; draw(); }
    }, {passive:true});
  }
  draw();
}

function renderGlossary(sec){
  detail.innerHTML = topbar(sec) + sec.terms.map(function(t){
    return '<div class="term"><b>' + esc(t.term) + '</b><p>' + esc(t.def) + '</p></div>';
  }).join('') +
  '<div class="nav"><button class="primary" id="ok">Понятно</button></div>';
  bindBack();
  document.getElementById('ok').onclick = function(){
    markDone(sec.id); renderHome(); show('home');
  };
}

/* калькулятор */
function renderCalc(sec){
  var v = {};
  sec.fields.forEach(function(f){ v[f.key] = f.default; });

  detail.innerHTML = topbar(sec) +
    '<p class="intro">' + esc(sec.intro) + '</p>' +
    sec.fields.map(function(f){
      return '<div class="field"><div class="row"><label>' + esc(f.label) + '</label>' +
        '<span class="val" id="v_' + f.key + '"></span></div>' +
        '<input type="range" id="r_' + f.key + '" min="' + f.min + '" max="' + f.max +
        '" step="' + f.step + '" value="' + f.default + '"></div>';
    }).join('') +
    '<div class="result" id="res"></div>' +
    '<p class="note">' + esc(sec.note) + '</p>' +
    '<div class="nav" style="margin-top:18px"><button class="primary" id="ok">Понятно</button></div>';
  bindBack();

  function calc(){
    var gross  = v.amount * v.spread / 100;
    var c1     = v.amount * v.fee1  / 100;
    var c2     = v.amount * v.fee2  / 100;
    var slip   = v.amount * v.slip  / 100;
    var net    = gross - c1 - c2 - slip;
    var breakeven = v.fee1 + v.fee2 + v.slip;

    sec.fields.forEach(function(f){
      var el = document.getElementById('v_' + f.key);
      el.textContent = f.unit === '₽'
        ? v[f.key].toLocaleString('ru-RU') + ' ₽'
        : v[f.key].toFixed(2) + ' %';
    });

    var verdict = net > 0
      ? 'Сделка в плюсе — но посмотри, какая часть разницы ушла на издержки.'
      : 'Сделка в минусе. Разница есть, а прибыли нет — её целиком съели издержки.';

    document.getElementById('res').innerHTML =
      '<p class="gross">На калькуляторе</p>' +
      '<p class="gross-v">' + money(gross) + '</p>' +
      '<div class="costs">' +
        '<div class="cost"><span>Комиссия площадки 1</span><span>−' + money(c1) + '</span></div>' +
        '<div class="cost"><span>Комиссия площадки 2</span><span>−' + money(c2) + '</span></div>' +
        '<div class="cost"><span>Проскальзывание</span><span>−' + money(slip) + '</span></div>' +
      '</div>' +
      '<div class="total"><span>В реальности</span><b style="color:' +
        (net > 0 ? 'var(--green)' : 'var(--red)') + '">' + money(net) + '</b></div>' +
      '<div class="verdict">' + verdict +
        '<br><br>Чтобы выйти в ноль, разница должна быть не меньше <b style="color:var(--gold)">' +
        breakeven.toFixed(2) + ' %</b>.</div>';
  }

  sec.fields.forEach(function(f){
    document.getElementById('r_' + f.key).oninput = function(e){
      v[f.key] = parseFloat(e.target.value); calc();
    };
  });
  calc();

  document.getElementById('ok').onclick = function(){
    markDone(sec.id); renderHome(); show('home');
  };
}

function renderOffer(sec){
  detail.innerHTML = topbar(sec) +
    '<div class="block"><h3>' + esc(sec.free_title) + '</h3>' +
      (sec.free_text
        ? '<p class="free-text">' + esc(sec.free_text) + '</p>'
        : '<ul>' + (sec.free_items || []).map(function(i){
            return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>') +
    '</div>' +
    '<div class="block paid"><h3>' + esc(sec.paid_title) + '</h3><ul>' +
      sec.paid_items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') +
    '</ul></div>' +
    '<a class="cta" id="cta" href="' + esc(DATA.app.channel_url) + '" target="_blank" rel="noopener">' +
      esc(sec.cta) + '</a>' +
    '<p class="honest">' + esc(sec.honest) + '</p>';
  bindBack();
  document.getElementById('cta').onclick = function(e){
    markDone(sec.id);
    goal('to_channel');
    var url = DATA.app.channel_url;
    try {
      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.openLink) {
        e.preventDefault();
        if (/^https?:\/\/t\.me\//.test(url)) Telegram.WebApp.openTelegramLink(url);
        else Telegram.WebApp.openLink(url);
      }
    } catch (err) {}
  };
}

/* ---------- загрузка ---------- */
fetch('data.json?v=' + Date.now())
  .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
  .then(function(j){ DATA = j; renderHome(); })
  .catch(function(){
    if (FALLBACK){ DATA = FALLBACK; renderHome(); return; }
    home.innerHTML = '<div class="stub">Не удалось загрузить данные.<br>' +
      'Проверь, что рядом с index.html лежит файл data.json.</div>';
  });
</script>
</body>
</html>
